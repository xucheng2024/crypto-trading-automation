name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install PostgreSQL server binaries for integration tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql
          pg_bin="$(pg_config --bindir)"
          wrapper_dir="$RUNNER_TEMP/postgres-bin"
          mkdir --parents "$wrapper_dir"
          printf '%s\n' '#!/usr/bin/env bash' 'set -euo pipefail' 'args=("$@")' 'data_dir=""' 'for ((i=0; i<${#args[@]}; i++)); do if [ "${args[$i]}" = "-D" ]; then data_dir="${args[$((i+1))]}"; fi; done' "\"$pg_bin/initdb\" \"\${args[@]}\"" 'printf "\nunix_socket_directories = '\''/tmp'\''\n" >> "$data_dir/postgresql.conf"' > "$wrapper_dir/initdb"
          chmod +x "$wrapper_dir/initdb"
          echo "$pg_bin" >> "$GITHUB_PATH"
          echo "$wrapper_dir" >> "$GITHUB_PATH"
      - name: Verify PostgreSQL can start as the runner user
        shell: bash
        run: |
          set -euo pipefail
          data_dir="$(mktemp -d)"
          log_file="$data_dir/postgres.log"
          cleanup() { pg_ctl -D "$data_dir" -m immediate -w stop >/dev/null 2>&1 || true; cat "$log_file" 2>/dev/null || true; rm -rf "$data_dir"; }
          trap cleanup EXIT
          initdb -D "$data_dir" --no-locale -E UTF8 -A trust
          pg_ctl -D "$data_dir" -l "$log_file" -o '-p 55432 -h 127.0.0.1' -w start
      - run: npm ci
      - run: npm test
      - run: npm run test:iac
      - run: npm run test:container
      # `npm test` already executes the real PostgreSQL integration suite;
      # keep the distinct migration report without starting that suite twice.
      - run: node scripts/migration-rehearsal.mjs
