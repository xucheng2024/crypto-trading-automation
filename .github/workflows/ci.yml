name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install PostgreSQL server binaries for integration tests
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql
          pg_config --bindir >> "$GITHUB_PATH"
      - run: npm ci
      - run: npm test
      - run: npm run test:iac
      - run: npm run test:container
      - run: npm run migrate:rehearsal
