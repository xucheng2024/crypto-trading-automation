name: Production runner bootstrap

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-runner-bootstrap
  cancel-in-progress: false

env:
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  ACR_NAME: ${{ vars.ACR_NAME }}
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
  CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}

jobs:
  deploy_runner:
    runs-on: ubuntu-latest
    # This job creates deployment resources and therefore uses the deployment
    # identity's existing production-off OIDC subject, not the SQL identity.
    environment: production-off
    steps:
      - uses: actions/checkout@v4
      - name: Require the dedicated runner registration credential
        env:
          GH_RUNNER_PAT: ${{ secrets.GH_RUNNER_PAT }}
        run: test -n "$GH_RUNNER_PAT"
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - uses: docker/setup-buildx-action@v3
      - name: Resolve and verify the current GitHub Actions runner release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release="$(gh api repos/actions/runner/releases/latest)"
          version="$(jq -r '.tag_name | sub("^v"; "")' <<<"$release")"
          asset="actions-runner-linux-x64-${version}.tar.gz"
          digest="$(jq -r --arg asset "$asset" '.assets[] | select(.name == $asset) | .digest // empty' <<<"$release")"
          [[ "$digest" == sha256:* ]] || { echo "GitHub runner release is missing a SHA-256 asset digest" >&2; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "sha256=${digest#sha256:}" >> "$GITHUB_OUTPUT"
      - run: az acr login --name "$ACR_NAME"
      - name: Build and push the pinned runner image
        id: image
        env:
          VERSION: ${{ steps.release.outputs.version }}
          SHA256: ${{ steps.release.outputs.sha256 }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$ACR_LOGIN_SERVER/github-actions-runner:$VERSION"
          docker buildx build --platform linux/amd64 --push \
            --build-arg RUNNER_VERSION="$VERSION" --build-arg RUNNER_SHA256="$SHA256" \
            --tag "$tag" infrastructure/runner
          digest="$(az acr repository show --name "$ACR_NAME" --image "github-actions-runner:$VERSION" --query digest --output tsv)"
          echo "image=$ACR_LOGIN_SERVER/github-actions-runner@$digest" >> "$GITHUB_OUTPUT"
      - name: Deploy the VNet-integrated ephemeral runner
        env:
          GH_RUNNER_PAT: ${{ secrets.GH_RUNNER_PAT }}
          RUNNER_IMAGE: ${{ steps.image.outputs.image }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GH_RUNNER_PAT"
          environment_id="$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$CONTAINER_APP_NAME" --query properties.managedEnvironmentId --output tsv)"
          registry_id="$(az acr show --resource-group "$RESOURCE_GROUP" --name "$ACR_NAME" --query id --output tsv)"
          location="$(az group show --name "$RESOURCE_GROUP" --query location --output tsv)"
          runner_name="${CONTAINER_APP_NAME%-engine}-github-runner"
          az deployment group create --resource-group "$RESOURCE_GROUP" --name "github-runner-${GITHUB_RUN_ID}" \
            --template-file infrastructure/bicep/github-runner.bicep \
            --parameters location="$location" runnerName="$runner_name" environmentId="$environment_id" \
              registryId="$registry_id" registryServer="$ACR_LOGIN_SERVER" runnerImage="$RUNNER_IMAGE" \
              githubRepository="$GITHUB_REPOSITORY" githubRunnerPat="$GH_RUNNER_PAT" \
            --output none
          for attempt in {1..36}; do
            revision="$(az containerapp show --resource-group "$RESOURCE_GROUP" --name "$runner_name" --query properties.latestRevisionName --output tsv)"
            ready="$(az containerapp replica list --resource-group "$RESOURCE_GROUP" --name "$runner_name" --revision "$revision" --query 'length([?properties.containers[?ready == `true`]])' --output tsv)"
            online="$(GH_TOKEN="$GH_RUNNER_PAT" gh api "repos/${GITHUB_REPOSITORY}/actions/runners?per_page=100" \
              --jq '[.runners[] | select(.status == "online" and any(.labels[]; .name == "crypto-remote-migration"))] | length')"
            [ "$ready" = "1" ] && [ "$online" -ge 1 ] && exit 0
            sleep 5
          done
          echo "GitHub runner container did not become ready and online" >&2
          exit 1
