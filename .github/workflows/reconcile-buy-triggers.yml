name: Reconcile buy triggers

on:
  repository_dispatch:
    types: [reconcile-triggers]
  workflow_dispatch:
    inputs:
      mode:
        description: "cancel only, or cancel then rebuild"
        required: true
        default: rebuild
        type: choice
        options:
          - rebuild
          - cancel

concurrency:
  group: okx-buy-trigger-reconciliation
  # Do not interrupt an in-flight reconciliation: it could be between a
  # verified cancel and order creation. Keep every subsequent dispatch in FIFO
  # order instead of GitHub replacing the single default pending run.
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  reconcile:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
      OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY }}
      OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE }}
      OKX_ORDER_SIZE: ${{ secrets.OKX_ORDER_SIZE }}
      OKX_TESTNET: ${{ secrets.OKX_TESTNET }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_D1_DATABASE_ID: ${{ secrets.CLOUDFLARE_D1_DATABASE_ID }}
      CLOUDFLARE_D1_API_TOKEN: ${{ secrets.CLOUDFLARE_D1_API_TOKEN }}
      TRIGGER_REBUILD_CONCURRENCY: "1"
      TRIGGER_REBUILD_PAUSE_MS: "250"
      TRIGGER_MODE: ${{ github.event_name == 'repository_dispatch' && github.event.client_payload.mode || github.event.inputs.mode || 'rebuild' }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Verify required secrets
        run: |
          set -eu
          for name in OKX_API_KEY OKX_SECRET_KEY OKX_PASSPHRASE OKX_ORDER_SIZE CLOUDFLARE_ACCOUNT_ID CLOUDFLARE_D1_DATABASE_ID CLOUDFLARE_D1_API_TOKEN; do
            if [ -z "$(printenv "$name")" ]; then
              echo "Missing required secret: $name" >&2
              exit 1
            fi
          done
      - run: node scripts/github-trigger-reconcile.mjs "${{ env.TRIGGER_MODE }}"
