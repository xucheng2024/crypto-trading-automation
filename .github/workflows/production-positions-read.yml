name: Production managed positions (read only)

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: production-positions-read
  cancel-in-progress: false

jobs:
  managed_positions:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: [self-hosted, linux, x64, crypto-remote-migration]
    environment: production-migrate
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --omit=dev
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_MIGRATION_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Query the redacted managed-position summary
        env:
          POSTGRES_URL: ${{ vars.POSTGRES_MIGRATION_URL }}
        run: node scripts/query-managed-positions.mjs | sed -n 's/^MANAGED_POSITIONS_JSON://p' > managed-positions.json
      - uses: actions/upload-artifact@v4
        with:
          name: managed-positions
          path: managed-positions.json
          retention-days: 1
          if-no-files-found: error
