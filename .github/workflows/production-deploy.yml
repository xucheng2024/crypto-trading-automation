name: Production deploy

on:
  workflow_dispatch:
    inputs:
      promote_full:
        description: Promote the verified OFF revision to FULL after approval
        required: true
        default: false
        type: boolean
      ci_wait_attempts:
        description: Maximum CI-success lookup attempts
        required: true
        default: '120'
        type: string
      ci_wait_seconds:
        description: Seconds between CI-success lookup attempts
        required: true
        default: '5'
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}
  ACR_NAME: ${{ vars.ACR_NAME }}
  ACR_LOGIN_SERVER: ${{ vars.ACR_LOGIN_SERVER }}
  CONTAINER_APP_NAME: ${{ vars.CONTAINER_APP_NAME }}
  POSTGRES_MIGRATION_URL: ${{ vars.POSTGRES_MIGRATION_URL }}
  CI_WAIT_ATTEMPTS: ${{ inputs.ci_wait_attempts }}
  CI_WAIT_SECONDS: ${{ inputs.ci_wait_seconds }}

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Require a successful CI run for this exact commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          [[ "$CI_WAIT_ATTEMPTS" =~ ^[1-9][0-9]*$ ]] || { echo 'ci_wait_attempts must be a positive integer' >&2; exit 1; }
          [[ "$CI_WAIT_SECONDS" =~ ^[1-9][0-9]*$ ]] || { echo 'ci_wait_seconds must be a positive integer' >&2; exit 1; }
          for attempt in $(seq 1 "$CI_WAIT_ATTEMPTS"); do
            count="$(gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/ci.yml/runs?head_sha=${GITHUB_SHA}&event=push&status=success&per_page=1" --jq '.total_count')"
            [ "$count" -gt 0 ] && exit 0
            echo "Waiting for CI success for ${GITHUB_SHA} (attempt ${attempt}/${CI_WAIT_ATTEMPTS})"
            sleep "$CI_WAIT_SECONDS"
          done
          echo "No successful CI run found for ${GITHUB_SHA}" >&2
          exit 1

  build:
    needs: validate
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - id: cached
        name: Reuse an image already built for this commit
        shell: bash
        run: |
          if az acr repository show --name "$ACR_NAME" --image "trading-engine:${GITHUB_SHA}" --output none 2>/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - if: ${{ steps.cached.outputs.exists != 'true' }}
        uses: docker/setup-buildx-action@v3
      - if: ${{ steps.cached.outputs.exists != 'true' }}
        run: az acr login --name "$ACR_NAME"
      - if: ${{ steps.cached.outputs.exists != 'true' }}
        run: docker buildx build --platform linux/amd64 --push --cache-from type=gha --cache-to type=gha,mode=max --tag "$ACR_LOGIN_SERVER/trading-engine:${GITHUB_SHA}" .
      - id: image
        run: |
          digest="$(az acr repository show --name "$ACR_NAME" --image "trading-engine:${GITHUB_SHA}" --query digest --output tsv)"
          image="$ACR_LOGIN_SERVER/trading-engine@$digest"
          if [ "${{ steps.cached.outputs.exists }}" != "true" ]; then
            docker buildx imagetools inspect "$image" | grep --fixed-strings "linux/amd64"
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

  migrate:
    needs: build
    runs-on: ubuntu-latest
    environment: production-migrate
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_MIGRATION_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - id: plan
        name: Skip PostgreSQL when the reviewed migration set is unchanged
        shell: bash
        run: |
          set -euo pipefail
          server="$(node -p 'new URL(process.env.POSTGRES_MIGRATION_URL).hostname.split(".")[0]')"
          expected="$(node scripts/postgres-migration-fingerprint.mjs)"
          current="$(az postgres flexible-server show --resource-group "$RESOURCE_GROUP" --name "$server" --query tags.githubMigrationHash --output tsv)"
          changed=true
          [ "$current" = "$expected" ] && changed=false
          {
            echo "server=$server"
            echo "hash=$expected"
            echo "changed=$changed"
          } >> "$GITHUB_OUTPUT"
          echo "Migration set changed: $changed"
      - if: ${{ steps.plan.outputs.changed == 'true' }}
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: ${{ steps.plan.outputs.changed == 'true' }}
        run: npm ci --omit=dev
      - id: firewall
        if: ${{ steps.plan.outputs.changed == 'true' }}
        name: Create the short-lived migration firewall rule
        shell: bash
        run: |
          set -euo pipefail
          test -n "$POSTGRES_MIGRATION_URL"
          server="${{ steps.plan.outputs.server }}"
          runner_ip="$(curl --fail --silent --show-error https://api.ipify.org)"
          rule="github-migration-${GITHUB_RUN_ID}"
          az postgres flexible-server firewall-rule create --resource-group "$RESOURCE_GROUP" --server-name "$server" --name "$rule" --start-ip-address "$runner_ip" --end-ip-address "$runner_ip" --output none
          echo "server=$server" >> "$GITHUB_OUTPUT"
          echo "rule=$rule" >> "$GITHUB_OUTPUT"
      - name: Apply reviewed migrations through Entra authentication
        if: ${{ steps.plan.outputs.changed == 'true' }}
        run: npm run migrate:apply
      - if: ${{ always() && steps.plan.outputs.changed == 'true' }}
        name: Remove the short-lived migration firewall rule
        shell: bash
        env:
          SERVER: ${{ steps.firewall.outputs.server }}
          RULE: ${{ steps.firewall.outputs.rule }}
        run: |
          test -z "$SERVER" || test -z "$RULE" || az postgres flexible-server firewall-rule delete --resource-group "$RESOURCE_GROUP" --server-name "$SERVER" --name "$RULE" --yes --output none
      - if: ${{ steps.plan.outputs.changed == 'true' }}
        name: Record the successfully applied migration set
        shell: bash
        run: |
          server_id="$(az postgres flexible-server show --resource-group "$RESOURCE_GROUP" --name "${{ steps.plan.outputs.server }}" --query id --output tsv)"
          az tag update --resource-id "$server_id" --operation Merge --tags githubMigrationHash="${{ steps.plan.outputs.hash }}" --output none

  deploy_off:
    needs: [build, migrate]
    runs-on: ubuntu-latest
    environment: production-off
    outputs:
      revision: ${{ steps.deploy.outputs.revision }}
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - id: deploy
        shell: bash
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -euo pipefail
          suffix="off-${GITHUB_SHA:0:7}-${GITHUB_RUN_NUMBER}"
          revision="$(az containerapp update --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" --image "$IMAGE" --set-env-vars TRADING_MODE=OFF --revision-suffix "$suffix" --query properties.latestRevisionName --output tsv)"
          for old in $(az containerapp revision list --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" --query "[?properties.active].name" --output tsv); do
            [ "$old" = "$revision" ] || az containerapp revision deactivate --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" --revision "$old" --output none
          done
          for attempt in {1..36}; do
            state="$(az containerapp revision show --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" --revision "$revision" --query "[properties.runningState, properties.healthState]" --output tsv | paste -sd ' ' -)"
            echo "Revision $revision: $state (attempt $attempt/36)"
            [ "$state" = "RunningAtMaxScale Healthy" ] && break
            [[ "$state" == Failed* || "$state" == Degraded* ]] && exit 1
            sleep 5
          done
          [ "$state" = "RunningAtMaxScale Healthy" ]
          [ "$(az containerapp revision list --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" --query "[?properties.active].name | length(@)" --output tsv)" = "1" ]
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  promote_full:
    if: ${{ inputs.promote_full }}
    needs: [build, deploy_off]
    runs-on: ubuntu-latest
    environment: production-full
    steps:
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_DEPLOY_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Promote the already-verified digest and verify the singleton revision
        shell: bash
        env:
          IMAGE: ${{ needs.build.outputs.image }}
        run: |
          set -euo pipefail
          suffix="full-${GITHUB_SHA:0:7}-${GITHUB_RUN_NUMBER}"
          revision="$(az containerapp update --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" --image "$IMAGE" --set-env-vars TRADING_MODE=FULL --revision-suffix "$suffix" --query properties.latestRevisionName --output tsv)"
          for old in $(az containerapp revision list --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" --query "[?properties.active].name" --output tsv); do
            [ "$old" = "$revision" ] || az containerapp revision deactivate --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" --revision "$old" --output none
          done
          for attempt in {1..36}; do
            state="$(az containerapp revision show --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" --revision "$revision" --query "[properties.runningState, properties.healthState]" --output tsv | paste -sd ' ' -)"
            echo "Revision $revision: $state (attempt $attempt/36)"
            [ "$state" = "RunningAtMaxScale Healthy" ] && break
            [[ "$state" == Failed* || "$state" == Degraded* ]] && exit 1
            sleep 5
          done
          [ "$state" = "RunningAtMaxScale Healthy" ]
          [ "$(az containerapp revision list --name "$CONTAINER_APP_NAME" --resource-group "$RESOURCE_GROUP" --query "[?properties.active].name | length(@)" --output tsv)" = "1" ]
