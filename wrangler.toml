name = "crypto-trading-cloudflare-prod"
main = "src/index.js"
compatibility_date = "2026-08-03"

[vars]
TRADING_ENABLED = "false"
OKX_TESTNET = "false"
OKX_MIN_USD_VALUE = "0.01"
# Conservative per-task pacing for OKX reads; scheduled jobs are serialized.
# OKX public endpoints are IP-limited; Cloudflare egress is shared.  Keep a
# full trigger rebuild below one request per second to avoid shared-IP 429s.
OKX_REQUEST_GAP_MS = "1200"

[[durable_objects.bindings]]
name = "CRON_DEDUP"
class_name = "CronDeduplicator"

[[d1_databases]]
binding = "DB"
database_name = "crypto-trading-prod"
database_id = "8b580393-82aa-41ce-8ad7-b4bb4bd3450a"
migrations_dir = "migrations"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CronDeduplicator"]

[triggers]
# Legacy scheduling is intentionally disabled before the Azure OFF cutover.
# Keep the Worker and D1 for rollback/audit, but do not recreate these crons.
crons = []

# 密钥配置 (需要在Cloudflare Dashboard中设置)
# OKX_API_KEY / OKX_SECRET_KEY / OKX_PASSPHRASE must be Worker secrets.
# OKX_ORDER_SIZE can be a secret or a non-sensitive variable.
# MANUAL_TRIGGER_TOKEN = "a-long-random-secret-for-authorized-manual-runs"
